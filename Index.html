<!DOCTYPE html>
<html>
<head>
<title>Test Login Page</title>
<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}
.login-box {
  background: rgba(0,0,0,0.6);
  padding: 25px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
}
input {
  width: 90%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
}
button {
  width: 95%;
  padding: 10px;
  background: #00ffcc;
  border: none;
  border-radius: 6px;
}
.note {
  font-size: 12px;
  color: #aaa;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>Login Test Page</h2>
  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">
  <button onclick="fakeLogin()">Login</button>
  <p class="note">⚠️ Demo only — no real data saved</p>
</div>

<script>
function fakeLogin() {
  alert("Login test successful — demo only");
}
</script>

</body>
</html>
